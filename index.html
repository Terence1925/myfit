<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyFit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#191a1f" />
    <script>
      // Apply the saved light/dark choice before the app loads so there is no flash of the wrong theme.
      try {
        var c = localStorage.getItem('myfit_theme') || 'system'
        var d = c === 'dark' || (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#191a1f' : '#f3f4f7')
      } catch (e) {}
    </script>
    <title>MyFit: All-in-One Workout &amp; Calorie Tracker</title>
    <meta name="description" content="MyFit builds personalized workout programs and nutrition targets tailored to your body, recovery, and goals." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
