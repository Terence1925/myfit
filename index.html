<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyFit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#191a1f" />
    <script>
      // Apply the saved light/dark choice before the app loads so there is no flash of the wrong theme.
      try {
        var c = localStorage.getItem('myfit_theme') || 'system'
        var d = c === 'dark' || (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#191a1f' : '#f3f4f7')
      } catch (e) {}
    </script>
    <title>MyFit: Workout &amp; Calorie Log</title>
    <meta name="description" content="12-week workout plans that adjust every week, plus a free food log with a barcode scanner." />
    <!-- How the link looks when it is shared (Facebook, Messenger, WhatsApp, X). The image must be a full web address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyFit" />
    <meta property="og:title" content="MyFit: Workout &amp; Calorie Log" />
    <meta property="og:description" content="12-week workout plans that adjust every week, plus a free food log." />
    <meta property="og:url" content="https://getmyfit.vercel.app/" />
    <meta property="og:image" content="https://getmyfit.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app has drawn nothing after a few seconds, say so instead of leaving an empty page, and show what went wrong.
      (function () {
        var errors = []
        window.addEventListener('error', function (e) { errors.push(String(e.message) + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')') })
        window.addEventListener('unhandledrejection', function (e) { errors.push('Promise: ' + String((e.reason && (e.reason.message || e.reason)) || '')) })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.children.length > 0) return
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:sans-serif;color:#888"><div style="font-size:22px;font-weight:700">The app could not start</div><div style="font-size:14px;max-width:320px">Close the app and open it again. If it keeps happening, send a screenshot of this page.</div><pre style="max-width:320px;white-space:pre-wrap;word-break:break-word;font-size:11px;text-align:left">' + errors.join(String.fromCharCode(10)).replace(/</g, '&lt;').slice(0, 600) + '</pre></div>'
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
